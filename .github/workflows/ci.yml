name: CI
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Push-to-main runs must never be replaced while pending (a later no-bump
  # push would silently drop a version-bump's release run); PR runs may.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  floor:
    # Read scopes the floor uses with github.token (Jev's triage answer on the
    # head's check-runs). A called workflow gets no more than this; on a
    # private repo the triage read 403s without it and the PR runs the full
    # suite. No write scope, no secret: this is the lane a PR controls.
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: lexijamesesq/dotty/.github/workflows/estate-ci.yml@v1
    with:
      dotty_ref: v1

  all-checks-passed:
    needs: [floor, validate-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every dependency to have succeeded (a job skipped on a mechanical PR is satisfied)
        env:
          RESULTS: ${{ toJSON(needs) }}
          MECHANICAL: ${{ needs.floor.outputs.mechanical }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # skipped is satisfied on a mechanical PR, and on any non-PR event (a
          # push to main skips the PR-only jobs by their own `if:`); on a
          # functional PR a skipped job is a failure.
          bad="$(jq -r --arg mech "$MECHANICAL" --arg event "$EVENT" '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled"
                     or (.value.result == "skipped" and $mech != "true" and $event == "pull_request"))
            | .key' <<<"$RESULTS")"
          if [[ -n "$bad" ]]; then
            echo "required job(s) not satisfied: $bad"
            exit 1
          fi
          echo "all checks passed (event=${EVENT} mechanical=${MECHANICAL:-false})"

  validate-and-test:
    needs: [floor]
    if: ${{ needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install Claude Code CLI 2.1.259
        run: npm install -g @anthropic-ai/claude-code@2.1.259
      - name: claude plugin validate --strict
        run: claude plugin validate --strict .

  release-check:
    needs: [floor]
    # PR-time, no writes; required by branch protection so content changes
    # without a version bump are blocked, not reported after the fact.
    if: ${{ (github.event_name == 'pull_request') && needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check plugin version discipline
        run: bash .github/scripts/check-plugin-version.sh . system

  release-tag:
    # Push-time, main only. Tag + GitHub Release when the declared version
    # isn't tagged yet. contents: write scoped to this job only.
    if: ${{ (github.event_name == 'push') && needs.floor.outputs.mechanical != 'true' }}
    needs: [floor, validate-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Configure git identity for the release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install Claude Code CLI 2.1.259
        run: npm install -g @anthropic-ai/claude-code@2.1.259
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/tag-plugin-release.sh . system
